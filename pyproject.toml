[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-auditor"
version = "0.1.0"
description = "Audit an LLM-as-judge for human agreement, position bias and verbosity bias."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest"]

[project.scripts]
judge-audit = "judge_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
